<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>WebSocket Chat</title>
  <style>
    :root { color-scheme: light dark; --bg: #f6f6f4; --fg: #1d1d1b; --muted: #77756f; --line: #dddbd5; --accent: #2f6fdb; --card: #fff; }
    @media (prefers-color-scheme: dark) { :root { --bg: #171716; --fg: #ecebe7; --muted: #9a988f; --line: #33322f; --card: #20201e; --accent: #6f9cf0; } }
    * { box-sizing: border-box; }
    body { margin: 0; font: 15px/1.45 system-ui, sans-serif; background: var(--bg); color: var(--fg); display: grid; place-items: center; min-height: 100vh; padding: 16px; }
    main { width: 100%; max-width: 560px; background: var(--card); border: 1px solid var(--line); border-radius: 12px; display: flex; flex-direction: column; height: min(640px, 90vh); }
    header { padding: 12px 16px; border-bottom: 1px solid var(--line); display: flex; justify-content: space-between; align-items: center; }
    header small { color: var(--muted); }
    #log { flex: 1; overflow-y: auto; padding: 12px 16px; display: flex; flex-direction: column; gap: 6px; }
    .system { color: var(--muted); font-size: 13px; }
    .from { font-weight: 600; margin-right: 6px; }
    .me .from { color: var(--accent); }
    .job { font-family: ui-monospace, monospace; font-size: 13px; }
    progress { width: 120px; vertical-align: middle; }
    form { display: flex; gap: 8px; padding: 12px 16px; border-top: 1px solid var(--line); }
    input { flex: 1; padding: 8px 10px; border: 1px solid var(--line); border-radius: 8px; background: transparent; color: inherit; font: inherit; }
    button { padding: 8px 14px; border: 0; border-radius: 8px; background: var(--accent); color: #fff; font: inherit; cursor: pointer; }
  </style>
</head>
<body>
<main>
  <header><strong>WebSocket Chat</strong><small id="status">conectando…</small></header>
  <div id="log"></div>
  <form id="form">
    <input id="input" placeholder="Mensagem, /job relatorio ou /cancel" autocomplete="off" autofocus>
    <button>Enviar</button>
  </form>
</main>
<script>
  const log = document.getElementById('log');
  const status = document.getElementById('status');
  const input = document.getElementById('input');
  let me = null;
  const jobRows = {};

  function add(html, cls) {
    const div = document.createElement('div');
    div.className = cls || '';
    div.innerHTML = html;
    log.appendChild(div);
    log.scrollTop = log.scrollHeight;
    return div;
  }
  const esc = (s) => String(s).replace(/[&<>"]/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));

  // Mesmo host/porta da página: o servidor HTTP faz o upgrade para WebSocket.
  const ws = new WebSocket(`ws://${location.host}`);

  ws.onopen = () => (status.textContent = 'conectado');
  ws.onclose = () => { status.textContent = 'desconectado'; add('Conexão encerrada.', 'system'); };

  ws.onmessage = (event) => {
    const msg = JSON.parse(event.data);
    if (msg.type === 'welcome') { me = msg.name; status.textContent = `você é ${me} · ${msg.online} online`; }
    else if (msg.type === 'system') add(esc(msg.text), 'system');
    else if (msg.type === 'chat') add(`<span class="from">${esc(msg.from)}</span>${esc(msg.text)}`, msg.from === me ? 'me' : '');
    else if (msg.type === 'job') {
      const row = jobRows[msg.name] ||= add('', 'job');
      const p = msg.progress ?? 0;
      row.innerHTML = `job <b>${esc(msg.name)}</b> <progress max="100" value="${p}"></progress> ${p}% · ${esc(msg.status)}`;
      if (msg.status !== 'running' && msg.status !== 'started') delete jobRows[msg.name];
    }
  };

  document.getElementById('form').onsubmit = (e) => {
    e.preventDefault();
    if (input.value.trim() && ws.readyState === WebSocket.OPEN) ws.send(input.value);
    input.value = '';
  };
</script>
</body>
</html>
